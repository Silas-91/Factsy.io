<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Factsy</title>
    <link rel="icon" type="image/png" href="../src/images/logo_4_round.png">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .content-page {
            padding: 120px 0;
            max-width: 800px;
            margin: 0 auto;
        }
        .content-page h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
        }
        .content-page h2 {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--accent-color);
            font-weight: 600;
        }
        .contact-info {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="../src/images/logo_4_round.png" alt="Factsy Logo">
                <span>Factsy</span>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="content-page">
            <a href="../index.html" class="back-link">← Zurück zur Startseite</a>
            <h1>Kontakt</h1>

            <div class="contact-info">
                <p>Hast du Fragen, Feedback oder Anregungen zu Factsy? Wir freuen uns, von dir zu hören!</p>
                <br>
                <h2>E-Mail</h2>
                <p><a href="mailto:support@factsy.de" style="color: var(--accent-color); font-weight: 600;">support@factsy.de</a></p>
                
                <h2 style="margin-top: 40px;">Social Media</h2>
                <p>Folge uns für tägliche Fakten und Updates:</p>
                <p>[Link zu Instagram/Twitter/etc.]</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Factsy. Alle Rechte vorbehalten.</p>
        </div>
    </footer>
</body>
</html>
